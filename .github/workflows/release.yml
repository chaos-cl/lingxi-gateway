name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "手动构建时发布的标签（留空则只上传 workflow artifacts）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mac:
    name: macOS (arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npx electron-builder --mac --publish never

      - name: List artifacts
        run: ls -lah dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 3   # 免费额度仅 0.5GB；发布到 Release 后 artifacts 无保留价值

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npx electron-builder --win --publish never

      - name: List artifacts
        shell: bash
        run: ls -lah dist/*.exe dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 3   # 免费额度仅 0.5GB；发布到 Release 后 artifacts 无保留价值

  release:
    name: Publish Release
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show collected files
        run: find artifacts -type f -printf '%p  %s bytes\n'

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 灵犀网关 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macos-packages/*.dmg
            artifacts/windows-packages/*.exe
            artifacts/windows-packages/*.zip

      - name: Delete artifacts after publish（Actions 存储免费额度仅 0.5GB，发布完成即清）
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            macos-packages
            windows-packages

  cleanup-artifacts:
    name: Cleanup old release assets（只保留最新版本）
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove assets of non-latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          latest_tag="${GITHUB_REF_NAME}"
          echo "保留最新版本: $latest_tag"
          for rel in $(gh release list -R "$REPO" --limit 50 --json tagName -q '.[].tagName'); do
            [ "$rel" = "$latest_tag" ] && continue
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              echo "  $rel: 删除 $asset"
              gh release delete-asset "$rel" "$asset" -R "$REPO" -y || true
            done < <(gh release view "$rel" -R "$REPO" --json assets -q '.assets[].name')
          done
