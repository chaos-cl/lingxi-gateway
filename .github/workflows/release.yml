name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "手动构建时发布的标签（留空则只上传 workflow artifacts）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mac:
    name: macOS (arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npx electron-builder --mac --publish never

      - name: List artifacts
        run: ls -lah dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npx electron-builder --win --publish never

      - name: List artifacts
        shell: bash
        run: ls -lah dist/*.exe dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show collected files
        run: find artifacts -type f -printf '%p  %s bytes\n'

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 灵犀网关 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macos-packages/*
            artifacts/windows-packages/*
